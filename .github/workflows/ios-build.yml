# Builds a signed ReefRun iOS IPA on a GitHub-hosted Mac.
# This workflow does not run on push. Start it by hand from the Actions tab.
# TestFlight upload stays off unless you set "Upload the finished IPA to TestFlight".

name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the finished IPA to TestFlight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ipa:
    name: Export and sign IPA
    # Godot 4.7.2's iOS template references iOS 26 Metal and Core Animation
    # symbols. macos-15 defaults to Xcode 16.4, whose iOS 18.5 SDK does not
    # contain them. macos-26 provides Xcode 26.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_DIR: 4.7.2.stable
      BUNDLE_ID: com.lunarentertainment.reefrun
      GODOT_MACOS_SHA256: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Select an Xcode with the iOS 26 Metal symbols
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          required = {
              "QuartzCore": (
                  "CADynamicRangeAutomatic",
                  "CADynamicRangeConstrainedHigh",
                  "CADynamicRangeHigh",
                  "CADynamicRangeStandard",
              ),
              "Metal": ("MTLTensorDomain",),
          }
          apps = sorted(pathlib.Path("/Applications").glob("Xcode*.app"))
          if not apps:
              print("No Xcode is installed on this runner.")
              sys.exit(1)

          def version_key(text):
              parts = []
              for piece in text.split("."):
                  digits = "".join(ch for ch in piece if ch.isdigit())
                  parts.append(int(digits or 0))
              return tuple(parts)

          def command(developer_dir, args):
              result = subprocess.run(
                  args,
                  env={**os.environ, "DEVELOPER_DIR": str(developer_dir)},
                  text=True,
                  capture_output=True,
                  check=False,
              )
              return result.returncode, (result.stdout or "") + (result.stderr or "")

          candidates = []
          print("Installed Xcode applications:")
          for app in apps:
              developer = app / "Contents" / "Developer"
              code, version_text = command(developer, ["xcodebuild", "-version"])
              version = "unknown"
              for line in version_text.splitlines():
                  if line.startswith("Xcode "):
                      version = line.split()[1]
                      break
              code, sdk_text = command(developer, ["xcodebuild", "-version", "-sdk", "iphoneos", "SDKVersion"])
              sdk = sdk_text.strip().splitlines()[-1].strip() if code == 0 and sdk_text.strip() else "unavailable"
              missing = []
              sdk_root = developer / "Platforms" / "iPhoneOS.platform" / "Developer" / "SDKs" / "iPhoneOS.sdk"
              for framework, names in required.items():
                  framework_dir = sdk_root / "System" / "Library" / "Frameworks" / f"{framework}.framework"
                  blob = ""
                  if framework_dir.exists():
                      for path in framework_dir.rglob("*"):
                          if path.is_file() and path.suffix in {".tbd", ".yaml", ".dylib"}:
                              blob += path.read_text(errors="ignore")
                  missing.extend(name for name in names if name not in blob)
              print(f"  {app}  Xcode {version}  iPhoneOS {sdk}  missing={missing or 'none'}")
              if code == 0 and not missing and version_key(version) >= (26,):
                  candidates.append((version_key(sdk), version_key(version), app, developer, version, sdk))

          if not candidates:
              print("")
              print("No installed Xcode SDK exports the symbols required by Godot 4.7.2.")
              print("Those symbols first shipped in the iOS 26 SDK (Xcode 26 or newer).")
              print("Xcode 16.4 and its iOS 18.5 SDK cannot link libgodot.a.")
              print("Use a GitHub macos-26 runner, where Xcode 26 is installed.")
              print("A local Mac needs Xcode 26 or newer as well.")
              print("Stubbing the symbols would not produce a valid TestFlight binary.")
              sys.exit(1)

          candidates.sort()
          _sdk_key, _version_key, app, developer, version, sdk = candidates[-1]
          env_path = pathlib.Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as handle:
              handle.write(f"XCODE_APP={app}\n")
              handle.write(f"DEVELOPER_DIR={developer}\n")
              handle.write(f"SELECTED_XCODE_VERSION={version}\n")
              handle.write(f"SELECTED_IPHONEOS_SDK={sdk}\n")
          pathlib.Path(os.environ["RUNNER_TEMP"], "selected-xcode.txt").write_text(str(app), encoding="utf-8")
          print(f"Selected {app}")
          print(f"Xcode {version}, iPhoneOS SDK {sdk}")
          PY
          XCODE_APP="$(cat "$RUNNER_TEMP/selected-xcode.txt")"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Reject developer-only release settings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(".")
          daily = (root / "scripts/daily_test_mode.gd").read_text(encoding="utf-8")
          ads = (root / "scripts/ads/ad_config.gd").read_text(encoding="utf-8")
          preset = (root / "export_presets.cfg").read_text(encoding="utf-8")
          project = (root / "project.godot").read_text(encoding="utf-8")
          problems = []
          if "const DAILY_CHALLENGE_TEST_MODE := false" not in daily:
              problems.append("Daily practice mode must stay false for a release export.")
          if "OS.is_debug_build()" in ads.split("static func use_mock_provider", 1)[-1]:
              problems.append("Mock rewarded ads must not run in exported builds.")
          if 'application/bundle_identifier="com.lunarentertainment.reefrun"' not in preset:
              problems.append("iOS bundle identifier is not com.lunarentertainment.reefrun.")
          if "application/export_project_only=true" not in preset:
              problems.append("iOS export must write an Xcode project for this workflow to sign.")
          if 'textures/vram_compression/import_etc2_astc=true' not in project:
              problems.append("ETC2/ASTC import is required for the iOS export.")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("Release gates passed.")
          PY

      - name: Install Godot 4.7.2 and iOS export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/macos.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fsSL -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${GODOT_MACOS_SHA256}  $RUNNER_TEMP/godot/macos.zip" | shasum -a 256 -c -
          echo "${GODOT_TEMPLATES_SHA256}  $RUNNER_TEMP/godot/templates.tpz" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/godot/macos.zip" -d "$RUNNER_TEMP/godot"
          xattr -cr "$RUNNER_TEMP/godot/Godot.app" || true
          codesign --force --deep --sign - "$RUNNER_TEMP/godot/Godot.app"
          template_root="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$template_root"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates-unpack"
          cp -R "$RUNNER_TEMP/godot/templates-unpack/templates/." "$template_root/"
          test -f "$template_root/ios.zip"
          template_version="$(tr -d '[:space:]' < "$template_root/version.txt")"
          editor_version="$("$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --version)"
          echo "Godot editor: ${editor_version}"
          echo "iOS export templates: ${template_version}"
          {
            echo "GODOT_EDITOR_VERSION<<EOF"
            echo "$editor_version"
            echo "EOF"
            echo "GODOT_TEMPLATE_VERSION<<EOF"
            echo "$template_version"
            echo "EOF"
          } >> "$GITHUB_ENV"
          case "$editor_version" in
            4.7.2.stable*) ;;
            *)
              echo "The Godot editor is ${editor_version}, not 4.7.2-stable."
              exit 1
              ;;
          esac
          case "$template_version" in
            4.7.2.stable*) ;;
            *)
              echo "The export templates are ${template_version}, not 4.7.2-stable."
              exit 1
              ;;
          esac

      - name: Install the Apple Distribution certificate and profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID}" ] || [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" ] || [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "Missing Apple signing secrets. Add APPLE_TEAM_ID, IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "$GITHUB_ENV"
          KEYCHAIN="$RUNNER_TEMP/reefrun.keychain-db"
          echo "KEYCHAIN_PATH=${KEYCHAIN}" >> "$GITHUB_ENV"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          case "$PROFILE_APP" in
            *".${BUNDLE_ID}") ;;
            *)
              echo "Provisioning profile application identifier does not end with ${BUNDLE_ID}."
              exit 1
              ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          {
            echo "PROFILE_NAME<<EOF"
            echo "$PROFILE_NAME"
            echo "EOF"
            echo "PROFILE_UUID<<EOF"
            echo "$PROFILE_UUID"
            echo "EOF"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/distribution.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the Team ID into the local export preset
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          team = os.environ.get("APPLE_TEAM_ID", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9]{10}", team):
              print("APPLE_TEAM_ID must be the 10-character Team ID from the Apple Developer account.")
              sys.exit(1)
          path = pathlib.Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^application/app_store_team_id="[^"]*"',
              f'application/app_store_team_id="{team}"',
              text,
              count=1,
          )
          if count != 1:
              print("Could not find application/app_store_team_id in export_presets.cfg.")
              sys.exit(1)
          path.write_text(updated, encoding="utf-8")
          print("Team ID applied to the runner copy of the iOS preset.")
          PY

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p build
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --export-release "iOS" "build/Reefrun"
          test -d build/Reefrun.xcodeproj

      - name: Link Metal and QuartzCore
        run: |
          set -euo pipefail
          PBX="build/Reefrun.xcodeproj/project.pbxproj"
          echo "Checking the Godot export before editing project.pbxproj."
          if ! plutil -lint "$PBX"; then
            echo "plutil rejected the exported project directly."
            echo "Retrying without the leading Xcode UTF-8 header. The project file is not rewritten by this check."
            tail -n +2 "$PBX" > "$RUNNER_TEMP/pbx-lint-before.pbxproj"
            if ! plutil -lint "$RUNNER_TEMP/pbx-lint-before.pbxproj"; then
              echo "Godot exported a project.pbxproj that is not valid OpenStep. It was not modified."
              exit 1
            fi
          fi
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          pbx_path = pathlib.Path("build/Reefrun.xcodeproj/project.pbxproj")
          original = pbx_path.read_text(encoding="utf-8")
          print("Godot 4.7.2 puts linker flags inside the quoted OTHER_LDFLAGS string.")
          print("A PBXFileReference named Metal.framework is not how this template links system frameworks.")
          print(f"pbxproj bytes before edit: {pbx_path.stat().st_size}")
          for label, pattern in (
              ("Metal.framework reference", r"Metal\.framework"),
              ("-framework Metal inside a value", r"-framework Metal(?![\w])"),
              ("QuartzCore.framework reference", r"QuartzCore\.framework"),
              ("-framework QuartzCore inside a value", r"-framework QuartzCore(?![\w])"),
              ("libgodot xcframework", r"libgodot\.ios\.release\.xcframework"),
          ):
              print(f"  {label}: {'yes' if re.search(pattern, original) else 'no'}")

          FLAGS = ("-framework Metal", "-framework QuartzCore")

          def fail(message):
              print(message)
              print("project.pbxproj was not modified.")
              sys.exit(1)

          def decode_quoted(raw):
              if len(raw) < 2 or raw[0] != '"' or raw[-1] != '"':
                  return None
              chars = []
              index = 1
              last = len(raw) - 1
              while index < last:
                  if raw[index] == "\\":
                      if index + 1 >= last:
                          return None
                      chars.append(raw[index + 1])
                      index += 2
                      continue
                  chars.append(raw[index])
                  index += 1
              return "".join(chars)

          def encode_quoted(value):
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return '"' + escaped + '"'

          def has_flag(value, flag):
              return re.search(re.escape(flag) + r"(?![\w])", value) is not None

          def with_flags(value):
              updated = value
              added = []
              for flag in FLAGS:
                  if has_flag(updated, flag):
                      continue
                  if updated and not updated.endswith(" "):
                      updated += " "
                  updated += flag
                  added.append(flag)
              return updated, added

          def read_quoted(text, start):
              index = start + 1
              while index < len(text):
                  if text[index] == "\\":
                      index += 2
                      continue
                  if text[index] == '"':
                      return text[start:index + 1], index + 1
                  index += 1
              return None, None

          def read_array(text, start):
              depth = 0
              index = start
              in_string = False
              while index < len(text):
                  char = text[index]
                  if in_string:
                      if char == "\\":
                          index += 2
                          continue
                      if char == '"':
                          in_string = False
                      index += 1
                      continue
                  if char == '"':
                      in_string = True
                      index += 1
                      continue
                  if char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          return text[start:index + 1], index + 1
                  index += 1
              return None, None

          def array_has_framework(array_text, framework):
              pattern = r'"-framework"\s*,\s*"' + re.escape(framework) + r'"'
              return re.search(pattern, array_text) is not None

          def with_framework_entries(array_text):
              added = []
              insertion = ""
              for framework in ("Metal", "QuartzCore"):
                  if array_has_framework(array_text, framework):
                      continue
                  insertion += '\n\t\t\t\t"-framework",\n\t\t\t\t"' + framework + '",'
                  added.append("-framework " + framework)
              if not insertion:
                  return array_text, added
              close = array_text.rfind(")")
              prefix = array_text[:close].rstrip()
              if not prefix.endswith("(") and not prefix.endswith(","):
                  prefix += ","
              line_start = array_text.rfind("\n", 0, close)
              if line_start == -1:
                  indent = ""
              else:
                  closer = array_text[line_start + 1:close]
                  indent = closer[:len(closer) - len(closer.lstrip(" \t"))]
              return prefix + insertion + "\n" + indent + ")", added

          def assignments(text):
              found = []
              cursor = 0
              key = "OTHER_LDFLAGS"
              while True:
                  at = text.find(key, cursor)
                  if at < 0:
                      break
                  if at > 0 and (text[at - 1].isalnum() or text[at - 1] == "_"):
                      cursor = at + len(key)
                      continue
                  value_at = at + len(key)
                  while value_at < len(text) and text[value_at] in " \t":
                      value_at += 1
                  if value_at >= len(text) or text[value_at] != "=":
                      cursor = at + len(key)
                      continue
                  value_at += 1
                  while value_at < len(text) and text[value_at] in " \t":
                      value_at += 1
                  if value_at >= len(text):
                      fail("OTHER_LDFLAGS has no value.")
                  if text[value_at] == '"':
                      raw, end = read_quoted(text, value_at)
                      kind = "quoted string"
                      if raw is None:
                          fail("OTHER_LDFLAGS string is unterminated.")
                  elif text[value_at] == "(":
                      raw, end = read_array(text, value_at)
                      kind = "array"
                      if raw is None:
                          fail("OTHER_LDFLAGS array is unterminated.")
                  else:
                      line_end = text.find("\n", at)
                      fail(
                          "OTHER_LDFLAGS is not a quoted string or an array:\n"
                          + text[at:line_end if line_end >= 0 else None]
                      )
                  semicolon = end
                  while semicolon < len(text) and text[semicolon] in " \t":
                      semicolon += 1
                  if semicolon >= len(text) or text[semicolon] != ";":
                      line_end = text.find("\n", at)
                      fail(
                          "OTHER_LDFLAGS is not followed by a semicolon:\n"
                          + text[at:line_end if line_end >= 0 else None]
                      )
                  found.append((value_at, end, raw, kind))
                  cursor = semicolon + 1
              return found

          def place_flags(raw, kind):
              if kind == "quoted string":
                  decoded = decode_quoted(raw)
                  if decoded is None:
                      fail("Could not decode OTHER_LDFLAGS string:\n" + raw)
                  updated, added = with_flags(decoded)
                  return encode_quoted(updated), added
              return with_framework_entries(raw)

          def show(text, raw_start, raw_end):
              line_start = text.rfind("\n", 0, raw_start) + 1
              line_end = text.find("\n", raw_end)
              if line_end < 0:
                  line_end = len(text)
              print(text[line_start:line_end])

          current = assignments(original)
          if not current:
              fail("The generated project has no OTHER_LDFLAGS setting, so Metal cannot be linked.")

          updated_text = original
          shift = 0
          for start, end, raw, kind in current:
              new_raw, added = place_flags(raw, kind)
              print(f"OTHER_LDFLAGS ({kind}) before:")
              show(original, start, end)
              if added:
                  print("Placed inside the value: " + " ".join(added))
              else:
                  print("This configuration already links Metal and QuartzCore.")
              start += shift
              end += shift
              updated_text = updated_text[:start] + new_raw + updated_text[end:]
              shift += len(new_raw) - (end - start)
              print(f"OTHER_LDFLAGS ({kind}) after:")
              show(updated_text, start, start + len(new_raw))

          checked = assignments(updated_text)
          if len(checked) != len(current):
              fail("Editing OTHER_LDFLAGS changed how many assignments parse.")
          for _start, _end, raw, kind in checked:
              if kind == "quoted string":
                  decoded = decode_quoted(raw)
                  if decoded is None:
                      fail("Edited OTHER_LDFLAGS string no longer parses.")
                  missing = [flag for flag in FLAGS if not has_flag(decoded, flag)]
              else:
                  missing = [
                      "-framework " + framework
                      for framework in ("Metal", "QuartzCore")
                      if not array_has_framework(raw, framework)
                  ]
              if missing:
                  fail("Edited OTHER_LDFLAGS is missing: " + ", ".join(missing))
              if re.search(r'"\s+-framework\b', raw):
                  fail("Linker flags were left outside the OTHER_LDFLAGS quotes.")

          if updated_text != original:
              pbx_path.write_bytes(updated_text.encode("utf-8"))
          print(f"pbxproj bytes after edit: {pbx_path.stat().st_size}")
          print(f"Updated {len(current)} OTHER_LDFLAGS configuration(s).")
          PY

      - name: Validate the Xcode project
        run: |
          set -euo pipefail
          PBX="build/Reefrun.xcodeproj/project.pbxproj"
          echo "Rejecting the broken form that appends -framework after the closing quote."
          if grep -E 'OTHER_LDFLAGS[[:space:]]*=[[:space:]]*".*"[[:space:]]+-framework' "$PBX"; then
            echo "OTHER_LDFLAGS has linker flags outside its quoted value."
            echo "That is invalid OpenStep, so xcodebuild cannot open the project."
            echo "Archive was not started."
            exit 1
          fi
          echo "plutil -lint (OpenStep project format)"
          if ! plutil -lint "$PBX"; then
            echo "plutil rejected project.pbxproj directly."
            echo "Retrying without the leading Xcode UTF-8 header. The project file is not rewritten by this check."
            tail -n +2 "$PBX" > "$RUNNER_TEMP/pbx-lint.pbxproj"
            if ! plutil -lint "$RUNNER_TEMP/pbx-lint.pbxproj"; then
              echo "project.pbxproj is not valid OpenStep."
              echo "Archive was not started."
              exit 1
            fi
          fi
          plutil -convert json -o "$RUNNER_TEMP/reefrun-pbx.json" "$PBX"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "reefrun-pbx.json").read_text(encoding="utf-8"))
          objects = data.get("objects", {})
          found = 0
          for obj in objects.values():
              if not isinstance(obj, dict):
                  continue
              settings = obj.get("buildSettings")
              if not isinstance(settings, dict) or "OTHER_LDFLAGS" not in settings:
                  continue
              found += 1
              name = obj.get("name", "unnamed configuration")
              value = settings["OTHER_LDFLAGS"]
              print(f"Parsed OTHER_LDFLAGS for {name}: {value!r}")
              missing = []
              if isinstance(value, str):
                  for framework in ("Metal", "QuartzCore"):
                      if re.search(r"-framework " + framework + r"(?![\w])", value) is None:
                          missing.append(framework)
              elif isinstance(value, list):
                  for framework in ("Metal", "QuartzCore"):
                      linked = any(
                          value[index] == "-framework" and value[index + 1] == framework
                          for index in range(len(value) - 1)
                      )
                      if not linked:
                          missing.append(framework)
              else:
                  missing.append("unrecognized OTHER_LDFLAGS value")
              if missing:
                  print(f"{name} does not link: {', '.join(missing)}")
                  sys.exit(1)
          if found == 0:
              print("The parsed project has no OTHER_LDFLAGS setting.")
              sys.exit(1)
          print(f"Metal and QuartzCore are linked from {found} parsed configuration(s).")
          PY
          echo "xcodebuild -list -project build/Reefrun.xcodeproj"
          if ! xcodebuild -list -project build/Reefrun.xcodeproj; then
            echo "xcodebuild could not read build/Reefrun.xcodeproj."
            echo "Archive was not started."
            exit 1
          fi

      - name: Remove empty camera, microphone, and photo permission strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re
          keys = (
              "NSCameraUsageDescription",
              "NSMicrophoneUsageDescription",
              "NSPhotoLibraryUsageDescription",
          )
          for plist_path in pathlib.Path("build").rglob("*-Info.plist"):
              with plist_path.open("rb") as handle:
                  data = plistlib.load(handle)
              removed = [key for key in keys if key in data and str(data[key]).strip() == ""]
              for key in removed:
                  del data[key]
              if removed:
                  with plist_path.open("wb") as handle:
                      plistlib.dump(data, handle, sort_keys=False)
                  print(f"Removed empty permission strings from {plist_path.name}: {', '.join(removed)}")
          empty_string = re.compile(
              r'^\s*(NSCameraUsageDescription|NSMicrophoneUsageDescription|NSPhotoLibraryUsageDescription)\s*=\s*""\s*;\s*$'
          )
          for strings_path in pathlib.Path("build").rglob("InfoPlist.strings"):
              lines = strings_path.read_text(encoding="utf-8").splitlines(keepends=True)
              kept = [line for line in lines if not empty_string.match(line)]
              if kept != lines:
                  strings_path.write_text("".join(kept), encoding="utf-8")
                  print(f"Removed empty permission strings from {strings_path}")
          PY

      - name: Show selected Xcode and iPhoneOS SDK
        run: |
          set -euo pipefail
          echo "xcode-select: $(xcode-select -p)"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          echo "Selected Xcode app: ${XCODE_APP}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "Godot editor: ${GODOT_EDITOR_VERSION}"
          echo "iOS export templates: ${GODOT_TEMPLATE_VERSION}"
          case "${GODOT_EDITOR_VERSION}" in
            4.7.2.stable*) ;;
            *)
              echo "Godot editor ${GODOT_EDITOR_VERSION} does not match the 4.7.2-stable templates."
              exit 1
              ;;
          esac
          case "${GODOT_TEMPLATE_VERSION}" in
            4.7.2.stable*) ;;
            *)
              echo "Export templates ${GODOT_TEMPLATE_VERSION} do not match the 4.7.2-stable editor."
              exit 1
              ;;
          esac
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=${SDKROOT}" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          sdk = pathlib.Path(os.environ["SDKROOT"])
          needed = {
              "QuartzCore": (
                  "CADynamicRangeAutomatic",
                  "CADynamicRangeConstrainedHigh",
                  "CADynamicRangeHigh",
                  "CADynamicRangeStandard",
              ),
              "Metal": ("MTLTensorDomain",),
          }
          missing = []
          for framework, names in needed.items():
              root = sdk / "System" / "Library" / "Frameworks" / f"{framework}.framework"
              blob = ""
              if root.exists():
                  for path in root.rglob("*"):
                      if path.is_file() and path.suffix in {".tbd", ".yaml", ".dylib"}:
                          blob += path.read_text(errors="ignore")
              missing.extend(f"{framework} {name}" for name in names if name not in blob)
          if missing:
              print("Active iPhoneOS SDK is missing:")
              print("\n".join(missing))
              sys.exit(1)
          print(f"Active SDK contains the Godot 4.7.2 Metal symbols: {sdk}")
          PY

      - name: Archive with Xcode
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild \
            -project build/Reefrun.xcodeproj \
            -scheme Reefrun \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Reefrun.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export the App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "uploadSymbols": True,
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
          }
          with open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb") as handle:
              plistlib.dump(options, handle)
          PY
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Reefrun.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          cp "$IPA" build/Reefrun.ipa
          echo "IPA_PATH=build/Reefrun.ipa" >> "$GITHUB_ENV"
          unzip -q "build/Reefrun.ipa" -d "$RUNNER_TEMP/ipa-check"
          APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -name '*.app' -maxdepth 1 | head -n 1)"
          test -n "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          BUILT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BUILT_ID" = "$BUNDLE_ID"
          echo "Signed IPA bundle id: ${BUILT_ID}"

      - name: Upload the IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reefrun-ios
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_CONNECT_API_KEY_ID}" ] || [ -z "${APPSTORE_CONNECT_API_ISSUER_ID}" ] || [ -z "${APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64}" ]; then
            echo "TestFlight upload needs APPSTORE_CONNECT_API_KEY_ID, APPSTORE_CONNECT_API_ISSUER_ID, and APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64."
            exit 1
          fi
          # xcrun iTMSTransporter on GitHub-hosted runners only prints instructions to
          # install the Transporter app. altool is the Xcode upload tool, and it
          # reads AuthKey_<key id>.p8 from ~/.appstoreconnect/private_keys.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="${KEY_DIR}/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          unset APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64
          if [ ! -s "$KEY_PATH" ]; then
            echo "The App Store Connect API private key did not decode to a file."
            exit 1
          fi
          IPA="$(find build "${RUNNER_TEMP}/ipa" -name '*.ipa' -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "No exported IPA was found to upload."
            exit 1
          fi
          echo "Uploading $(basename "$IPA") with xcrun altool."
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID"

      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
