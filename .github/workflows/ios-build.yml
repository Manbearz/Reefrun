# Builds a signed ReefRun iOS IPA on a GitHub-hosted Mac.
# This workflow does not run on push. Start it by hand from the Actions tab.
# TestFlight upload stays off unless you set "Upload the finished IPA to TestFlight".

name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the finished IPA to TestFlight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ipa:
    name: Export and sign IPA
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_DIR: 4.7.2.stable
      BUNDLE_ID: com.lunarentertainment.reefrun
      GODOT_MACOS_SHA256: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Reject developer-only release settings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(".")
          daily = (root / "scripts/daily_test_mode.gd").read_text(encoding="utf-8")
          ads = (root / "scripts/ads/ad_config.gd").read_text(encoding="utf-8")
          preset = (root / "export_presets.cfg").read_text(encoding="utf-8")
          project = (root / "project.godot").read_text(encoding="utf-8")
          problems = []
          if "const DAILY_CHALLENGE_TEST_MODE := false" not in daily:
              problems.append("Daily practice mode must stay false for a release export.")
          if "OS.is_debug_build()" in ads.split("static func use_mock_provider", 1)[-1]:
              problems.append("Mock rewarded ads must not run in exported builds.")
          if 'application/bundle_identifier="com.lunarentertainment.reefrun"' not in preset:
              problems.append("iOS bundle identifier is not com.lunarentertainment.reefrun.")
          if "application/export_project_only=true" not in preset:
              problems.append("iOS export must write an Xcode project for this workflow to sign.")
          if 'textures/vram_compression/import_etc2_astc=true' not in project:
              problems.append("ETC2/ASTC import is required for the iOS export.")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("Release gates passed.")
          PY

      - name: Install Godot 4.7.2 and iOS export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/macos.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fsSL -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${GODOT_MACOS_SHA256}  $RUNNER_TEMP/godot/macos.zip" | shasum -a 256 -c -
          echo "${GODOT_TEMPLATES_SHA256}  $RUNNER_TEMP/godot/templates.tpz" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/godot/macos.zip" -d "$RUNNER_TEMP/godot"
          xattr -cr "$RUNNER_TEMP/godot/Godot.app" || true
          codesign --force --deep --sign - "$RUNNER_TEMP/godot/Godot.app"
          template_root="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$template_root"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates-unpack"
          cp -R "$RUNNER_TEMP/godot/templates-unpack/templates/." "$template_root/"
          test -f "$template_root/ios.zip"
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --version

      - name: Install the Apple Distribution certificate and profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID}" ] || [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" ] || [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "Missing Apple signing secrets. Add APPLE_TEAM_ID, IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "$GITHUB_ENV"
          KEYCHAIN="$RUNNER_TEMP/reefrun.keychain-db"
          echo "KEYCHAIN_PATH=${KEYCHAIN}" >> "$GITHUB_ENV"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          case "$PROFILE_APP" in
            *".${BUNDLE_ID}") ;;
            *)
              echo "Provisioning profile application identifier does not end with ${BUNDLE_ID}."
              exit 1
              ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          {
            echo "PROFILE_NAME<<EOF"
            echo "$PROFILE_NAME"
            echo "EOF"
            echo "PROFILE_UUID<<EOF"
            echo "$PROFILE_UUID"
            echo "EOF"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/distribution.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the Team ID into the local export preset
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          team = os.environ.get("APPLE_TEAM_ID", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9]{10}", team):
              print("APPLE_TEAM_ID must be the 10-character Team ID from the Apple Developer account.")
              sys.exit(1)
          path = pathlib.Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^application/app_store_team_id="[^"]*"',
              f'application/app_store_team_id="{team}"',
              text,
              count=1,
          )
          if count != 1:
              print("Could not find application/app_store_team_id in export_presets.cfg.")
              sys.exit(1)
          path.write_text(updated, encoding="utf-8")
          print("Team ID applied to the runner copy of the iOS preset.")
          PY

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p build
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --export-release "iOS" "build/Reefrun"
          test -d build/Reefrun.xcodeproj

      - name: Remove empty camera, microphone, and photo permission strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re
          keys = (
              "NSCameraUsageDescription",
              "NSMicrophoneUsageDescription",
              "NSPhotoLibraryUsageDescription",
          )
          for plist_path in pathlib.Path("build").rglob("*-Info.plist"):
              with plist_path.open("rb") as handle:
                  data = plistlib.load(handle)
              removed = [key for key in keys if key in data and str(data[key]).strip() == ""]
              for key in removed:
                  del data[key]
              if removed:
                  with plist_path.open("wb") as handle:
                      plistlib.dump(data, handle, sort_keys=False)
                  print(f"Removed empty permission strings from {plist_path.name}: {', '.join(removed)}")
          empty_string = re.compile(
              r'^\s*(NSCameraUsageDescription|NSMicrophoneUsageDescription|NSPhotoLibraryUsageDescription)\s*=\s*""\s*;\s*$'
          )
          for strings_path in pathlib.Path("build").rglob("InfoPlist.strings"):
              lines = strings_path.read_text(encoding="utf-8").splitlines(keepends=True)
              kept = [line for line in lines if not empty_string.match(line)]
              if kept != lines:
                  strings_path.write_text("".join(kept), encoding="utf-8")
                  print(f"Removed empty permission strings from {strings_path}")
          PY

      - name: Archive with Xcode
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/Reefrun.xcodeproj \
            -scheme Reefrun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Reefrun.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export the App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          options = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "uploadSymbols": True,
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
          }
          with open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb") as handle:
              plistlib.dump(options, handle)
          PY
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Reefrun.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          cp "$IPA" build/Reefrun.ipa
          echo "IPA_PATH=build/Reefrun.ipa" >> "$GITHUB_ENV"
          unzip -q "build/Reefrun.ipa" -d "$RUNNER_TEMP/ipa-check"
          APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -name '*.app' -maxdepth 1 | head -n 1)"
          test -n "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          BUILT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BUILT_ID" = "$BUNDLE_ID"
          echo "Signed IPA bundle id: ${BUILT_ID}"

      - name: Upload the IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reefrun-ios
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_CONNECT_API_KEY_ID}" ] || [ -z "${APPSTORE_CONNECT_API_ISSUER_ID}" ] || [ -z "${APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64}" ]; then
            echo "TestFlight upload needs APPSTORE_CONNECT_API_KEY_ID, APPSTORE_CONNECT_API_ISSUER_ID, and APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          xcrun iTMSTransporter -m upload -assetFile "$IPA_PATH" -apiKey "$APPSTORE_CONNECT_API_KEY_ID" -apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID"

      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
